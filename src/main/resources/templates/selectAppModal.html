<link href="/select2/select2.min.css" rel="stylesheet" />
<script src="/select2/select2.min.js"></script>

<div id="selectAppModal" class="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Select Application</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <select id="appSelect" class="form-control" style="width: 100%;">
          </select>
        </form>
      </div>
      <div class="modal-footer">
        <button id="selectAppButton" type="button" class="btn btn-primary" data-bs-dismiss="modal">Select</button>
      </div>
    </div>
  </div>
</div>

<script>
  var selectedAppData = null;
  $(document).ready(function () {
    $('#appSelect').select2({
      dropdownParent: $('#selectAppModal'),
      ajax: {
        url: '/api/select2/apps',
        dataType: 'json'
      }
    });
    $('#appSelect').on('select2:select', function (e) {
      selectedAppData = e.params.data;
    });
    $('#selectAppButton').on('click', function () {
      if (selectedAppData) {
        onAppSelected(selectedAppData);
      }
    });
  });
</script>
