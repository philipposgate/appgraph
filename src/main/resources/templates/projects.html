<div class="container-fluid">
    <div class="row">
        <div class="col">
            <h1 class="h2">Projects</h1>
        </div>
        <div class="col text-end">
            <a class="btn btn-primary btn-sm mb-3" th:href="@{'/projects/new'}">Create New Project</a>
        </div>
    </div>
</div>
<hr>

<table class="table table-hover">
    <thead>
        <tr>
            <th>Project Name</th>
            <th>Apps</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="project : ${projects}" th:onclick="|window.location.href='/projects/' + ${project.id}|" style="cursor: pointer;">
            <td th:text="${project.name}">Project Name</td>
            <td th:text="${#lists.size(project.apps)}">0</td>
        </tr>
    </tbody>    
</table>
