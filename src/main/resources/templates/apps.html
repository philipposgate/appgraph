<div class="container-fluid">
    <div class="row">
        <div class="col">
            <h1 class="h2">Applications</h1>
        </div>
        <div class="col text-end">
            <a class="btn btn-primary btn-sm mb-3" th:href="@{'/apps/new'}">Create New App</a>
        </div>
    </div>
</div>
<hr>

<table class="table table-hover">
    <thead>
        <tr>
            <th>Name</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="app : ${apps}" th:onclick="|window.location.href='/apps/' + ${app.id}|" style="cursor: pointer;">
            <td th:text="${app.name}">App Name</td>
        </tr>
    </tbody>    
</table>
