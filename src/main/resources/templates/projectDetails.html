<div class="container-fluid">
    <div class="row">
        <div class="col">
            <b>project</b>
            <h1 class="h2" th:text="${project.name}">Project Name</h1>
        </div>
        <div class="col text-end">
            <a class="btn btn-primary btn-sm mb-3" th:href="@{'/projects/' + ${project.id} + '/edit'}"><i class="bi bi-pencil-square"></i></a>
            <button id="deleteProjectBtn" class="btn btn-danger btn-sm mb-3"><i class="bi bi-trash"></i></button>
        </div>
    </div>
</div>
<hr>

<div class="container-fluid">
    <div class="row">
        <div class="col">
            <b>Applications</b>
        </div>
        <div class="col text-end">
            <button class="btn btn-primary btn-circle" data-bs-toggle="modal" data-bs-target="#selectAppModal"><i
                    class="bi bi-plus"></i></button>
        </div>
    </div>
</div>

<table class="table table-hover">
    <tbody>
        <tr th:each="projectApp : ${project.apps}" th:onclick="|window.location.href='/apps/' + ${projectApp.app.id}|"
            style="cursor: pointer;">
            <td th:text="${projectApp.app.name}">App Name</td>
            <td class="text-end">
                <button class="btn btn-secondary btn-circle removeAppFromProject"
                    th:attr="data-app-id=${projectApp.app.id}"><i class="bi bi-trash"></i></button>
            </td>

        </tr>
    </tbody>
</table>

<div th:replace="selectAppModal"></div>

<script>
    function onAppSelected(appData) {
        var url = '/api/projects/[[${project.id}]]/apps/' + appData.id;
        $.ajax({
            url: url,
            method: 'PUT',
            contentType: 'application/json',
            success: function () {
                location.reload();
            },
            error: function () {
                alert('Failed to add app');
            }
        });
    }

    $(document).ready(function () {
        $('.removeAppFromProject').click(function (event) {
            event.stopPropagation();
            if (confirm('Are you sure you want to remove this app from the project?')) {
                var appId = $(this).data('app-id');
                var url = '/api/projects/[[${project.id}]]/apps/' + appId;
                $.ajax({
                    url: url,
                    method: 'DELETE',
                    success: function () {
                        location.reload();
                    },
                    error: function () {
                        alert('Failed to remove app');
                    }
                });
            }
        });

        $('#deleteProjectBtn').click(function () {
            if (confirm('Are you sure you want to delete this project?')) {
                $.ajax({
                    url: '/api/projects/[[${project.id}]]',
                    method: 'DELETE',
                    success: function () {
                        window.location.href = '/';
                    },
                    error: function () {
                        alert('Failed to delete project');
                    }
                });
            }
        });
    });
</script>
