<div class="container-fluid">
    <div class="row">
        <div class="col">
            <b>project</b>
            <h1 class="h2" th:text="${project.name}">Project Name</h1>
        </div>
        <div class="col text-end">
            <a class="btn btn-primary btn-sm mb-3" th:href="@{'/projects/' + ${project.id} + '/edit'}">Edit Project</a>
        </div>
    </div>
</div>
<hr>

<div class="container-fluid">
    <div class="row">
        <div class="col">
            <b>Applications</b>
        </div>
        <div class="col text-end">
            <button class="btn btn-primary btn-circle" data-bs-toggle="modal" data-bs-target="#selectAppModal"><i class="bi bi-plus"></i></button>
        </div>
    </div>
</div>

<table class="table table-hover">
    <tbody>
        <tr th:each="projectApp : ${project.apps}" th:onclick="|window.location.href='/apps/' + ${projectApp.app.id}|" style="cursor: pointer;">
            <td th:text="${projectApp.app.name}">App Name</td>
        </tr>
    </tbody>
</table>

<div th:replace="selectAppModal"></div>

<script>
    function onAppSelected(appData) {
        var url = '/api/projects/[[${project.id}]]/apps/' + appData.id;
        $.ajax({
            url: url,
            method: 'PUT',
            contentType: 'application/json',
            success: function () {
                alert('App successfully added: ' + appData.text);
                location.reload();
            },
            error: function () {
                alert('Failed to add app');
            }
        });
    }
</script>
