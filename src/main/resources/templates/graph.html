<style>
    #graphContainer {
        width: 100%;
        height: 450px;
        background-color: #f0f0f0;
        border-color: #c9c9c9;
        border-width: 1px;
        border-style: solid;
    }
</style>
<div id="graphContainer">
    <!-- NVL graph goes here -->
</div>  
<script src="/cytoscape/cytoscape.min.js"></script>
<script>
    $(document).ready(function() {
        $.ajax({
            url: "/api/graph",
            method: "GET",
            success: function(graphData) {
                const cy = cytoscape({
                    container: document.getElementById('graphContainer'),
                    elements: graphData,
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'label': 'data(label)',
                                'background-color': '#007bff',
                                'color': '#fff',
                                'text-valign': 'center',
                                'text-halign': 'center',
                                'width': '60px',
                                'height': '60px',
                                'font-size': '12px'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'label': 'data(label)',
                                'width': 1,
                                'line-color': '#000000',
                                'curve-style': 'bezier',
                                'target-arrow-color': '#000000',
                                'target-arrow-shape': 'triangle'
                            }
                        }
                    ],
                    layout: {
                        name: 'random',
                        directed: true,
                        padding: 10
                    }
                });
            },
            error: function(xhr, status, error) {
                alert("Error loading graph data: " + xhr.responseText);
            }
        });
    });
</script>
