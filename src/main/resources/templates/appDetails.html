<div class="container-fluid">
    <div class="row">
        <div class="col">
            <b>application <span th:if="${project != null}">of project: <a th:text="${project.name}"
                        th:href="@{'/projects/' + ${project.id}}">Project Name</a></span></b>
            <h1 class="h2" th:text="${app.name}">App name</h1>
        </div>
        <div class="col text-end">
            <a class="btn btn-info btn-sm mb-3" th:href="@{'/graph/' + ${app.id}}">Graph</a>
            <a class="btn btn-primary btn-sm mb-3" th:href="@{'/apps/' + ${app.id} + '/edit'}"><i
                    class="bi bi-pencil-square"></i></a>
            <button id="deleteAppBtn" class="btn btn-danger btn-sm mb-3"><i class="bi bi-trash"></i></button>
        </div>
    </div>
</div>
<hr>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <b>Upstream Applications</b>
            <table class="table table-hover">
                <tbody>
                    <tr th:each="app : ${upstreamApps}" th:onclick="|window.location.href='/apps/' + ${app.id}|"
                        style="cursor: pointer;">
                        <td th:text="${app.name}">Upstream App Name</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-6">
            <div class="container-fluid">
                <div class="row">
                    <div class="col">
                        <b>Downstream Applications</b>
                    </div>
                    <div class="col text-end" style="padding-right: 8px;">
                        <button class="btn btn-primary btn-circle" data-bs-toggle="modal"
                            data-bs-target="#selectAppModal"><i class="bi bi-plus"></i></button>
                    </div>
                </div>
            </div>
            <table class="table table-hover">
                <tbody>
                    <tr th:each="connectsTo : ${app.connectsTo}"
                        th:onclick="|window.location.href='/apps/' + ${connectsTo.app.id}|" style="cursor: pointer;">
                        <td th:text="${connectsTo.app.name}">Downstream App Name</td>
                        <td class="text-end">
                            <button class="btn btn-secondary btn-circle deleteDownstreamConnection"
                                th:attr="data-connect-id=${connectsTo.app.id}"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<hr>

<div class="container-fluid">
    <div class="row">
        <div class="col">
            <b>Runtime Environments</b>
        </div>
        <div class="col text-end">
            <button id="addEnvBtn" class="btn btn-primary btn-circle" data-bs-toggle="popover"><i
                    class="bi bi-plus"></i></button>
        </div>
    </div>
    <div class="row mt-3" th:each="env : ${environments}">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${env.type}">Environment Type</h5>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="selectAppModal"></div>

<script>
    function onAppSelected(appData) {
        var url = '/api/apps/[[${app.id}]]/connect/' + appData.id;
        $.ajax({
            url: url,
            method: 'PUT',
            contentType: 'application/json',
            success: function () {
                location.reload();
            },
            error: function () {
                alert('Failed to connect app');
            }
        });
    }

    var addEnvPopover = new bootstrap.Popover(document.getElementById('addEnvBtn'), {
        title: 'Add Runtime Environment',
        content: `
                <div class="d-grid gap-2">
                    <button class="envTypeBtn btn btn-primary btn-sm">DEV</button>
                    <button class="envTypeBtn btn btn-primary btn-sm">SIT</button>
                    <button class="envTypeBtn btn btn-primary btn-sm">STAGE</button>
                    <button class="envTypeBtn btn btn-primary btn-sm">PROD</button>
                </div>
            `,
        html: true,
        sanitize: false,
        placement: 'auto',
        trigger: 'click'
    });

    document.addEventListener('click', function (e) {
        if (e.target && e.target.classList.contains('envTypeBtn')) {
            addEnvPopover.hide();
            var envType = e.target.textContent.trim();
            $.ajax({
                url: '/api/apps/[[${app.id}]]/environments',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ type: envType }),
                success: function () {
                    location.reload();
                },
                error: function () {
                    alert('Failed to add environment');
                }
            });
        }
    });

    $(document).ready(function () {
        $('.deleteDownstreamConnection').on('click', function (event) {
            event.stopPropagation();
            if (confirm('Are you sure you want to delete this connection?')) {
                var connectId = $(this).data('connect-id');
                $.ajax({
                    url: '/api/apps/[[${app.id}]]/connect/' + connectId,
                    method: 'DELETE',
                    success: function () {
                        location.reload();
                    },
                    error: function () {
                        alert('Failed to delete connection');
                    }
                });
            }
        });

        $('#deleteAppBtn').on('click', function () {
            if (confirm('Are you sure you want to delete this application?')) {
                $.ajax({
                    url: '/api/apps/[[${app.id}]]',
                    method: 'DELETE',
                    success: function () {
                        window.location.href = '/apps';
                    },
                    error: function () {
                        alert('Failed to delete application');
                    }
                });
            }
        });
    });
</script>
